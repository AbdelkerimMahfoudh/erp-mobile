# Security gate for the mobile app (docs/48 controls 1, 2 and 20).
#
# Every push and pull request: the whole git history is scanned for secrets,
# dependencies are audited with the lockfile, the app must type-check, lint,
# pass its pure and rendered tests, and its release configuration must be sound — an
# https API origin, no debug overlays, no server secret names in the bundle —
# and its exported bundles must carry nothing the app may not do about the
# free trial (`scripts/audit-bundle.js`).
name: security
on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/scan-secrets.js
  dependencies:
    name: dependency audit (lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # No critical advisory anywhere in the production tree. A high one fails the build when its package ships in the
      # app: the build-and-test job classifies each against the exported bundles (scripts/audit-shipped-deps.js).
      - run: npm audit --omit=dev --audit-level=critical
      - name: development dependencies (report only)
        run: npm audit --audit-level=high || true
  build-and-test:
    name: type-check, lint, tests, release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx expo lint --max-warnings 40
      # Two pure tests hold the app's bundled Storage and Colour lists to the server's own source, and fail when either
      # side moves: they read the backend beside this checkout, as on a developer's machine. The repository is public.
      - name: the backend beside this checkout
        run: git clone --depth 1 --branch reports-export https://github.com/AbdelkerimMahfoudh/erp-backend.git ../erp-backend
      - name: pure tests
        run: for f in $(find lib components -name '*.test.ts' | sort); do node "$f" || exit 1; done
      # The rendered screens under jest-expo — what a person sees and can press: the Owner's trial card with nothing
      # to press, the closed screen's three general actions, a sign-up that never says "wrong code" for a lost answer.
      - name: rendered tests
        run: npx jest --maxWorkers=2
      - name: release configuration
        run: EXPO_PUBLIC_API_ORIGIN=https://example.invalid EXPO_PUBLIC_LEGAL_ORIGIN=https://legal.example.invalid node scripts/verify-release-config.js
      - name: web export carries no server secret names
        run: |
          EXPO_PUBLIC_API_ORIGIN=https://example.invalid EXPO_PUBLIC_LEGAL_ORIGIN=https://legal.example.invalid npx expo export --platform web --source-maps --clear --output-dir "$RUNNER_TEMP/export-web"
          ! grep -rlE --include='*.js' 'WHATSAPP_ACCESS_TOKEN|OTP_PEPPER|JWT_ACCESS_SECRET|PLATFORM_ADMIN_KEY' "$RUNNER_TEMP/export-web/_expo/static/js"
      # The free trial is started on the website alone (2026-10-13), and the app prices, sells and activates no store or
      # staff seat (2026-10-15): the shipped web and iOS bundles — every module their source maps list, every string,
      # every call that could open a browser — must hold no claim, resend, link token, website address, QR code, web
      # view, browser, price or payment instruction, and must hold the read-only status route and the card's title, so
      # the scan cannot pass by scanning nothing.
      - name: exported bundles hold no trial action, website link, QR code, web view, browser, price or payment instruction
        run: |
          EXPO_PUBLIC_API_ORIGIN=https://example.invalid EXPO_PUBLIC_LEGAL_ORIGIN=https://legal.example.invalid npx expo export --platform ios --no-bytecode --source-maps --output-dir "$RUNNER_TEMP/export-ios"
          EXPO_PUBLIC_API_ORIGIN=https://example.invalid EXPO_PUBLIC_LEGAL_ORIGIN=https://legal.example.invalid node scripts/audit-bundle.js "$RUNNER_TEMP/export-web" "$RUNNER_TEMP/export-ios"
      # Every high or critical advisory, against the modules the two bundles actually contain (docs/48 §7.3).
      - name: no package with a high or critical advisory ships in the app
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          node scripts/audit-shipped-deps.js "$RUNNER_TEMP/audit.json" "$RUNNER_TEMP/export-web" "$RUNNER_TEMP/export-ios"
