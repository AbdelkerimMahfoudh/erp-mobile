# The app's rendered (Jest) suite on a Linux runner, with its output kept (D222).
#
# Since Expo SDK 58 the owner's PC cannot run it: Jest 30 resolves modules with `unrs-resolver`, whose native binary
# Windows Smart App Control blocks. The `security` workflow runs the same suite but its job log is not readable
# without repository rights, so this commits Jest's own report to this branch under evidence/<commit>-<run>/.
# Tooling only: it builds nothing, deploys nothing, touches no secret. Edit target.env and push to run it again.
name: render-tests

on:
  push:
    branches: [ops/render-tests]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-tests
  cancel-in-progress: false

jobs:
  jest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write # only to commit the evidence back to this branch
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
      - name: The target
        run: |
          set -a; source tools/target.env; set +a
          [[ "$MOBILE" =~ ^[0-9a-f]{40}$ ]] || { echo "MOBILE must be a full SHA"; exit 1; }
          echo "MOBILE=$MOBILE" >> "$GITHUB_ENV"
          echo "EV=$GITHUB_WORKSPACE/tools/evidence/${MOBILE:0:7}-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { repository: AbdelkerimMahfoudh/erp-mobile, ref: '${{ env.MOBILE }}', path: app }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          mkdir -p "$EV"
          [ "$(git -C app rev-parse HEAD)" = "$MOBILE" ] || { echo "the checkout is not $MOBILE"; exit 1; }
          (cd app && npm ci --no-audit --no-fund) > "$EV/install.log" 2>&1
      # The pure suites, every file run even after a failure (the security workflow stops at the first), each with
      # its own output. Two of them read the backend beside the checkout, as the security workflow provides it.
      - name: Pure tests
        run: |
          set -a; source "$GITHUB_WORKSPACE/tools/target.env"; set +a
          # BACKEND_BRANCH in target.env pairs a mobile feature branch with its backend branch; reports-export otherwise.
          git clone -q --depth 1 --branch "${BACKEND_BRANCH:-reports-export}" https://github.com/AbdelkerimMahfoudh/erp-backend.git erp-backend
          mkdir -p "$EV/pure"
          pass=0; fail=0
          cd app
          for f in $(find lib components -name '*.test.ts' | sort); do
            out="$EV/pure/$(echo "$f" | tr '/' '_').txt"
            if node "$f" > "$out" 2>&1; then pass=$((pass+1)); rm -f "$out"; else fail=$((fail+1)); echo "$f" >> "$EV/pure-failed.txt"; fi
          done
          echo "pure files: $pass passed, $fail failed" | tee "$EV/pure-summary.txt"
          cat "$EV/pure-failed.txt" 2>/dev/null || true
      # The security workflow's bundle checks, exactly as it runs them, with their output kept.
      - name: Exports and bundle audits
        run: |
          set +e
          cd app
          export EXPO_PUBLIC_API_ORIGIN=https://example.invalid EXPO_PUBLIC_LEGAL_ORIGIN=https://legal.example.invalid
          npx expo export --platform web --source-maps --clear --output-dir "$RUNNER_TEMP/export-web" > "$EV/export-web.log" 2>&1; echo "web export $?" > "$EV/audit-exit.txt"
          npx expo export --platform ios --no-bytecode --source-maps --output-dir "$RUNNER_TEMP/export-ios" > "$EV/export-ios.log" 2>&1; echo "ios export $?" >> "$EV/audit-exit.txt"
          node scripts/audit-bundle.js "$RUNNER_TEMP/export-web" "$RUNNER_TEMP/export-ios" > "$EV/audit-bundle.txt" 2>&1; echo "audit-bundle $?" >> "$EV/audit-exit.txt"
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json"
          node scripts/audit-shipped-deps.js "$RUNNER_TEMP/audit.json" "$RUNNER_TEMP/export-web" "$RUNNER_TEMP/export-ios" > "$EV/audit-shipped-deps.txt" 2>&1; echo "audit-shipped-deps $?" >> "$EV/audit-exit.txt"
          cat "$EV/audit-exit.txt"; tail -40 "$EV/audit-bundle.txt"
          # The pages as exported (no secret: placeholder API origin), to see what the browser is handed.
          mkdir -p "$EV/pages"; for p in login index +not-found; do cp "$RUNNER_TEMP/export-web/$p.html" "$EV/pages/" 2>/dev/null; done
          ls -la "$EV/pages" || true
      # What the web export shows in Chromium: page errors, console, text, test ids and a screenshot of three pages.
      - name: Web smoke
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/pw" && (cd "$RUNNER_TEMP/pw" && npm init -y > /dev/null && npm i --no-audit --no-fund playwright@1.63.0 > "$EV/pw-install.log" 2>&1 && npx playwright install --with-deps chromium >> "$EV/pw-install.log" 2>&1)
          node tools/web-smoke.mjs "$RUNNER_TEMP/pw/node_modules/playwright" "$RUNNER_TEMP/export-web" "$EV/web-smoke" > /dev/null 2>"$EV/web-smoke-stderr.txt"
          echo "web smoke $?" >> "$EV/audit-exit.txt"
          head -80 "$EV/web-smoke/web-smoke.txt" 2>/dev/null || cat "$EV/web-smoke-stderr.txt"
      - name: Rendered tests
        run: |
          set +e
          (cd app && npx jest --maxWorkers=2 --json --outputFile="$EV/jest.json") > "$EV/jest.txt" 2>&1
          echo "exit $?" > "$EV/exit.txt"
          set -e
          node -e '
            const r = require(process.argv[1]);
            const lines = [`suites ${r.numPassedTestSuites}/${r.numTotalTestSuites}, tests ${r.numPassedTests}/${r.numTotalTests}, failed ${r.numFailedTests}`];
            for (const s of r.testResults) for (const t of s.assertionResults) if (t.status === "failed")
              lines.push(`FAIL ${s.name.replace(/.*\/app\//, "")} :: ${t.fullName}\n  ${(t.failureMessages[0] || "").split("\n").slice(0, 12).join("\n  ")}`);
            for (const s of r.testResults) if (s.status === "failed" && !s.assertionResults.some((t) => t.status === "failed"))
              lines.push(`SUITE FAIL ${s.name.replace(/.*\/app\//, "")}\n  ${(s.message || "").split("\n").slice(0, 20).join("\n  ")}`);
            require("fs").writeFileSync(process.argv[2], lines.join("\n") + "\n");
          ' "$EV/jest.json" "$EV/summary.txt" || true
          cat "$EV/summary.txt" || true
      - name: Keep the evidence
        if: always()
        run: |
          cd tools
          git config user.name "render-tests"
          git config user.email "render-tests@users.noreply.github.com"
          git add evidence
          git commit -qm "evidence: rendered tests on ${MOBILE:0:7} (run $GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3 4 5; do git push -q origin HEAD:ops/render-tests && break; git pull -q --rebase origin ops/render-tests; done
      - name: The verdict
        run: grep -q '^exit 0$' "$EV/exit.txt" && [ ! -s "$EV/pure-failed.txt" ] && ! grep -qv ' 0$' "$EV/audit-exit.txt"
