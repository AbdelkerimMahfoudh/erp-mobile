# The browser ERP's visual-quality check (owner's iPhone review, 2026-10-24) in WebKit and Chromium.
#
# On a fresh runner: MySQL 8.4, the API built from BACKEND with every migration applied, an administrator with MFA, one
# fictional test business with a no-payment grant and its Owner's own password; the app's web export of MOBILE against
# that API; then verify/visual-check.mjs — the authentication pages in EN/FR/AR, light and dark, 320/375/390/768/1280
# and 1280 at 200%; the theme (first visit, persistence, no flash, keyboard); registration's three steps and the
# browser's Back; signed in, Team, its sheet and every exported route. WebKit here is browser automation on Linux, not a
# physical iPhone. Everything is fictional and disposable and ends with the runner; nothing is deployed.
name: visual-check

on:
  push:
    branches: [ops/visual-check]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-check
  cancel-in-progress: false

jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # only to commit the results back to this branch (evidence/runs/)
    services:
      mysql:
        image: mysql:8.4.11@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-timeout 5s --health-retries 30
    defaults:
      run:
        shell: bash
    env:
      WORK: ${{ github.workspace }}/work
      API: http://127.0.0.1:3410/api/v1
      APP: http://127.0.0.1:4320
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
      - name: The target
        run: |
          set -a; source tools/verify/target.env; set +a
          for v in BACKEND MOBILE; do [[ "${!v}" =~ ^[0-9a-f]{40}$ ]] || { echo "$v must be a full SHA"; exit 1; }; done
          { echo "BACKEND=$BACKEND"; echo "MOBILE=$MOBILE"; } >> "$GITHUB_ENV"
          echo "backend $BACKEND, mobile $MOBILE"
      - uses: actions/checkout@v4
        with: { repository: AbdelkerimMahfoudh/erp-backend, ref: '${{ env.BACKEND }}', path: api }
      - uses: actions/checkout@v4
        with: { repository: AbdelkerimMahfoudh/erp-mobile, ref: '${{ env.MOBILE }}', path: app }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          mkdir -p "$WORK"; chmod 700 "$WORK"
          (cd api && npm ci --no-audit --no-fund > "$WORK/api-install.log" 2>&1)
          (cd app && npm ci --no-audit --no-fund > "$WORK/app-install.log" 2>&1)
          (cd tools/verify && npm init -y > /dev/null && npm i --no-audit --no-fund playwright@1.63.0 > "$WORK/pw-install.log" 2>&1)
          (cd tools/verify && npx playwright install --with-deps webkit chromium > "$WORK/pw-browsers.log" 2>&1)
          (cd tools/browser-input && npm install --no-audit --no-fund > "$WORK/bi-install.log" 2>&1 && npx playwright install --with-deps webkit chromium > "$WORK/bi-browsers.log" 2>&1)
      - name: The database, the API, an administrator with MFA and one fictional test business
        run: |
          umask 077
          mysql -h 127.0.0.1 -P 3306 --protocol=TCP -u root -e "CREATE DATABASE vc CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
            CREATE USER 'phonestore_app'@'%' IDENTIFIED BY '$(openssl rand -hex 16 | tee "$WORK/app.pw")';
            GRANT SELECT, INSERT, UPDATE, DELETE ON vc.* TO 'phonestore_app'@'%';"
          {
            echo "NODE_ENV=development"; echo "APP_ENV=staging"; echo "PORT=3410"
            echo "DATABASE_URL=mysql://root:@127.0.0.1:3306/vc"
            echo "APP_DATABASE_URL=mysql://phonestore_app:$(cat "$WORK/app.pw")@127.0.0.1:3306/vc"
            for k in JWT_ACCESS_SECRET STAFF_INVITATION_KEY OTP_PEPPER MESSAGING_HASH_KEY; do echo "$k=$(openssl rand -hex 32)"; done
            echo "PLATFORM_MFA_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
            echo "CUSTOMER_ACTIVATION=closed"; echo "CORS_ORIGINS=$APP"
            echo "SWAGGER_ENABLED=false"; echo "LOG_LEVEL=warn"; echo "WHATSAPP_CHANNEL=disabled"; echo "EMAIL_CHANNEL=disabled"
            echo "UPLOAD_DIR=$WORK/uploads"; echo "THROTTLE_LIMIT=10000"; echo "AUTH_THROTTLE_LIMIT=2000"; echo "ACCOUNT_THROTTLE_LIMIT=2000"
          } > "$WORK/api.env"
          openssl rand -hex 24 > "$WORK/admin.pw"
          cd api
          set -a; source "$WORK/api.env"; set +a
          npx prisma generate > /dev/null
          npx nest build > "$WORK/api-build.log" 2>&1
          npx prisma migrate deploy > "$WORK/migrate.log" 2>&1
          PLATFORM_ADMIN_PASSWORD="$(cat "$WORK/admin.pw")" npx ts-node --transpile-only prisma/create-platform-admin.ts ops@example.test "Platform Ops" > /dev/null 2>&1
          npx ts-node --transpile-only prisma/platform-admin-mfa.ts enrolment-token ops@example.test > "$WORK/enrol.out" 2>&1
          nohup node dist/src/main.js > "$WORK/api.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:3410/api/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3410/api/health/ready; echo
          cd ..
          # The D219 verifier's enrolment first (it keeps the authenticator key); the seed then signs in with it.
          (cd tools/browser-input && WORK="$WORK" node verify/enrol.mjs)
          node tools/verify/seed.mjs
      - name: The app's web export against this API
        run: |
          (cd app && EXPO_PUBLIC_API_ORIGIN=${API%/api/v1} EXPO_PUBLIC_LEGAL_ORIGIN=https://legal.example.invalid npx expo export --platform web --clear --output-dir "$WORK/app-dist" > "$WORK/app-export.log" 2>&1)
          nohup node tools/verify/static-serve.mjs "$WORK/app-dist" 4320 > "$WORK/app-serve.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf -o /dev/null "$APP/" && break; sleep 1; done
          # Every exported page: `x/index` is visited as `x`, the home page as `?`, and one unknown address for the 404 page.
          echo "ROUTES=? $(cd "$WORK/app-dist" && find . -name '*.html' | sed 's#^\./##; s#\.html$##' | grep -vE '^\(|^\+|_sitemap|^(login|register|setup|join|verify)$|^dev/' | sed -E 's#(^|/)index$##' | sed 's#\[[a-z]*\]#00000000-0000-4000-8000-000000000000#g' | sort -u | tr '\n' ' ') no-such-page" >> "$GITHUB_ENV"
      - name: Expo Doctor on the target
        if: ${{ !cancelled() }}
        # One finding is documented and accepted (docs/75 §15.6, docs/71): Expo packages a few patch versions behind the
        # SDK, `expo-camera` pinned by the app's native patch — an owed upgrade that needs a native build, not a web
        # fix. This step passes with that finding alone and fails on any other.
        run: |
          mkdir -p "$WORK/results"
          (cd app && npx expo-doctor 2>&1) | tee "$WORK/results/expo-doctor.txt" || true
          failed=$(grep -E '^✖ ' "$WORK/results/expo-doctor.txt" | sort -u || true)
          known='✖ Check that packages match versions required by installed Expo SDK'
          if [ -z "$failed" ]; then echo "Expo Doctor: every check passed"
          elif [ "$failed" = "$known" ]; then echo "Expo Doctor: only the documented exception (docs/75 §15.6): $known"
          else echo "Expo Doctor: an undocumented finding:"; echo "$failed"; exit 1; fi
      - name: D219 regression — the access journey and the input matrix (copied verifier), WebKit then Chromium
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p "$WORK/results"
          cd tools/browser-input
          for b in webkit chromium; do
            WORK="$WORK" APP="$APP" API="$API" APPDIR="$GITHUB_WORKSPACE/app" BROWSER=$b node verify/access-journey.mjs 2>&1 | tee "$WORK/results/d219-journey-$b.txt"
            WORK="$WORK" APP="$APP" API="$API" APPDIR="$GITHUB_WORKSPACE/app" BROWSER=$b node verify/ui-input.mjs 2>&1 | tee "$WORK/results/d219-input-$b.txt"
          done
      - name: Businesses before the browsers
        run: echo "COMPANIES_BEFORE=$(mysql -h 127.0.0.1 -P 3306 --protocol=TCP -u root -N -e 'SELECT COUNT(*) FROM vc.companies')" >> "$GITHUB_ENV"
      - name: WebKit
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          API_ORIGIN=${API%/api/v1} BROWSER=webkit OWNER="$WORK/vc-owner.json" PW="$GITHUB_WORKSPACE/tools/verify/node_modules/playwright" OUT="$WORK/results" node tools/verify/visual-check.mjs | tee "$WORK/results/webkit.txt"
      - name: Chromium
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          API_ORIGIN=${API%/api/v1} BROWSER=chromium OWNER="$WORK/vc-owner.json" PW="$GITHUB_WORKSPACE/tools/verify/node_modules/playwright" OUT="$WORK/results" node tools/verify/visual-check.mjs | tee "$WORK/results/chromium.txt"
      - name: No business was created by the browsers (registration sent once, and refused while activation is closed)
        if: ${{ !cancelled() }}
        run: |
          after=$(mysql -h 127.0.0.1 -P 3306 --protocol=TCP -u root -N -e 'SELECT COUNT(*) FROM vc.companies')
          echo "businesses before $COMPANIES_BEFORE, after $after" | tee "$WORK/results/businesses.txt"
          [ "$after" = "$COMPANIES_BEFORE" ]
      - name: Summary
        if: always()
        run: |
          echo "== Expo Doctor"; grep -E "checks passed|^✖" "$WORK/results/expo-doctor.txt" 2>/dev/null | sort -u || true
          sed -n '/package *expected *found/,/^$/p' "$WORK/results/expo-doctor.txt" 2>/dev/null | head -20 || true
          echo "== Businesses"; cat "$WORK/results/businesses.txt" 2>/dev/null || true
          for b in webkit chromium; do echo "== $b"; grep -E "^FAIL|checks passed" "$WORK/results/$b.txt" 2>/dev/null | tail -15 || true; done
          for f in "$WORK"/results/d219-*.txt; do echo "== $(basename "$f" .txt)"; grep -E "^FAIL|checks passed" "$f" | tail -15 || true; done
      - name: Keep the results
        if: always()
        run: |
          # The export and static-server logs travel with the results (they hold no secret; the check below proves it).
          cp "$WORK/app-export.log" "$WORK/app-serve.log" "$WORK/results/" 2>/dev/null || true
          # Statuses and results only: nothing secret leaves the runner.
          if grep -rlE "$(cat "$WORK/admin.pw")|$(cat "$WORK/app.pw")" "$WORK/results" > /dev/null 2>&1; then echo "a secret reached the results"; exit 1; fi
      - name: Commit the results to this branch
        if: always()
        run: |
          [ -d "$WORK/results" ] || exit 0
          if grep -rlE "$(cat "$WORK/admin.pw")|$(cat "$WORK/app.pw")" "$WORK/results" > /dev/null 2>&1; then echo "a secret reached the results"; exit 1; fi
          dest="tools/evidence/runs/${MOBILE:0:7}-$GITHUB_RUN_ID"; mkdir -p "$dest"; cp -r "$WORK/results/." "$dest/"
          cd tools
          git config user.name "visual-check"; git config user.email "visual-check@users.noreply.github.com"
          git add evidence/runs
          git commit -qm "evidence: visual-check on ${MOBILE:0:7} (run $GITHUB_RUN_ID) [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git push -q origin HEAD:ops/visual-check && break; git pull -q --rebase origin ops/visual-check; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-check-results
          path: work/results/
          if-no-files-found: ignore
